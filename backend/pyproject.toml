[project]
name = "amiga-vivo"
version = "0.1.0"
description = "Intelligent VendorInvoice-to-Voucher Processing"
requires-python = ">=3.14"

dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "shortuuid>=1.0.13",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.uv]
managed = true

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "T20"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["**/tests/*"]
