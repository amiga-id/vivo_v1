[project]
name = "amiga-vivo"
version = "0.1.0"
description = "Intelligent VendorInvoice-to-Voucher Processing"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "shortuuid>=1.0.13",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.uv]
managed = true

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "T20"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
