<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMIGA Intake: ruang kerja per peran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --pink:#ee9db9; --pink-deep:#b84f7a; --pink-soft:#fbe9f0; --blush:#fef8fa;
  --teal:#308087; --teal-deep:#256a70; --teal-soft:#e4f1f0;
  --on-teal:#ffffff; --on-pink:#ffffff;
  --ink:#2a3540; --muted:#667580; --line:#eddde5; --surface:#ffffff; --bg:#fbf6f8;
  --ok:#2d8660; --ok-soft:#e3f3ea; --warn:#9a6400; --warn-soft:#fbf0d8; --err:#bf4660; --err-soft:#fbe6ea;
  --hero-from:#fde6ee; --hero-to:#e6f2f1; --hero-ink:#3a2a35; --hero-sub:#5b4a55;
  --hero-chip:rgba(255,255,255,.65); --hero-chip-line:rgba(184,79,122,.22);
  --shadow:rgba(110,80,100,.22);
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --script:'Pacifico','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pink:#e394b3; --pink-deep:#f1abc6; --pink-soft:#3b2832; --blush:#1d1820;
    --teal:#62b4ba; --teal-deep:#8ad0d4; --teal-soft:#193436;
    --on-teal:#0f2a2c; --on-pink:#3a1527;
    --ink:#eee8f0; --muted:#aea3b5; --line:#382e41; --surface:#241e2b; --bg:#1b161f;
    --ok:#59c99b; --ok-soft:#183a2e; --warn:#eab04a; --warn-soft:#3b3015; --err:#f0899f; --err-soft:#432430;
    --hero-from:#33242f; --hero-to:#1f2d33; --hero-ink:#f6eef2; --hero-sub:#cfc2cc;
    --hero-chip:rgba(255,255,255,.08); --hero-chip-line:rgba(255,255,255,.18);
    --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --pink:#e394b3; --pink-deep:#f1abc6; --pink-soft:#3b2832; --blush:#1d1820;
  --teal:#62b4ba; --teal-deep:#8ad0d4; --teal-soft:#193436;
  --on-teal:#0f2a2c; --on-pink:#3a1527;
  --ink:#eee8f0; --muted:#aea3b5; --line:#382e41; --surface:#241e2b; --bg:#1b161f;
  --ok:#59c99b; --ok-soft:#183a2e; --warn:#eab04a; --warn-soft:#3b3015; --err:#f0899f; --err-soft:#432430;
  --hero-from:#33242f; --hero-to:#1f2d33; --hero-ink:#f6eef2; --hero-sub:#cfc2cc;
  --hero-chip:rgba(255,255,255,.08); --hero-chip-line:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1140px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .word{font-family:var(--script);font-size:28px;line-height:1;color:var(--teal)}
.brand small{color:var(--muted);font-size:13px;font-weight:500;padding-left:10px;border-left:2px solid var(--pink)}
.me{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pink-soft);color:var(--pink-deep);display:grid;place-items:center;font-weight:700}
.me b{display:block;line-height:1.2}
.me span.r{font-size:12.5px;color:var(--teal-deep);font-weight:600}

.hero{background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);color:var(--hero-ink);padding:38px 20px 76px;border-bottom:1px solid var(--line)}
.hero-in{max-width:1140px;margin:0 auto}
.hero h1{margin:0 0 8px;font-size:clamp(26px,4.2vw,40px);line-height:1.15;font-weight:700;letter-spacing:-.01em;max-width:22ch}
.hero p{margin:0;max-width:64ch;font-size:16px;color:var(--hero-sub)}
.scope{margin-top:16px;display:inline-flex;gap:10px;align-items:flex-start;background:var(--hero-chip);border:1px solid var(--hero-chip-line);padding:9px 14px;border-radius:var(--r-md);font-size:14px;max-width:72ch}

main{max-width:1140px;margin:-48px auto 0;padding:0 20px 56px;position:relative}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;overflow-x:auto;box-shadow:0 10px 30px -18px var(--shadow)}
.tabs button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:11px 18px;border-radius:calc(var(--r-lg) - 6px);cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button:hover{background:var(--pink-soft);color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--teal);color:var(--on-teal);font-weight:600}
.tabs svg{width:17px;height:17px;flex:none}
.screen{margin-top:20px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.card h2{margin:0 0 4px;font-size:19px;font-weight:700}
.card h2::after{content:"";display:block;width:34px;height:3px;border-radius:3px;background:var(--pink);margin-top:8px}
.card .sub{color:var(--muted);margin:10px 0 16px;font-size:14px}
.m{color:var(--muted);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:2px}
.kpi b{font-size:30px;line-height:1.1;font-weight:700}
.kpi span{color:var(--muted);font-size:14px}
.kpi.warn b{color:var(--err)} .kpi.good b{color:var(--teal)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--pink);color:var(--ink);font-weight:600}
select,input[type=text],input[type=date],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 12px}
select.inline{width:auto;padding:6px 10px}
select:hover,input:hover,textarea:hover{border-color:var(--pink)}
input:disabled{opacity:.6}

.queue{display:grid;gap:10px}
.q{display:grid;grid-template-columns:1.7fr 1.2fr 1fr 1fr 1.1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px}
.q:hover{border-color:var(--pink)}
.q .t{font-weight:600}
.q .issue{font-size:13px;color:var(--err);display:flex;gap:6px;align-items:flex-start}
.q .none{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;background:var(--teal-soft);color:var(--teal-deep)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.s-Perlu,.badge.s-Dikembalikan,.badge.s-Ditolak,.badge.s-Konflik{background:var(--err-soft);color:var(--err)}
.badge.s-Diproses,.badge.s-Menunggu{background:var(--warn-soft);color:var(--warn)}
.badge.s-Disetujui,.badge.s-Aktif{background:var(--ok-soft);color:var(--ok)}
.badge.s-Dicabut{background:var(--err-soft);color:var(--err)}
.due.late{color:var(--err);font-weight:600} .due.today{color:var(--warn);font-weight:600} .due{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1.5px solid var(--teal);background:transparent;color:var(--teal-deep);padding:8px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--teal-soft)}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.primary:hover:not(:disabled){background:var(--teal-deep)}
.btn.pink{background:var(--pink-deep);border-color:var(--pink-deep);color:var(--on-pink)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.danger:hover:not(:disabled){background:var(--err-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 14px;font-size:14px}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;border:2px solid var(--line)}
.step.done i{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.step.now i{border-color:var(--pink-deep);color:var(--pink-deep)}
.step.now{color:var(--ink);font-weight:600}
.drop{display:grid;place-items:center;text-align:center;gap:6px;border:2px dashed var(--pink);background:var(--blush);border-radius:var(--r-lg);padding:34px 18px;cursor:pointer;transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:var(--pink-soft);border-color:var(--pink-deep)}
.drop b{font-size:17px} .drop span{color:var(--muted);font-size:14px}
.drop.has{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.form label{display:grid;gap:6px;font-weight:600;font-size:14px}
.form .full{grid-column:1/-1}
.form small{font-weight:400;color:var(--muted)}
.err-t{color:var(--err);font-size:13px;font-weight:500}
.delegate{display:flex;gap:8px;align-items:center;background:var(--teal-soft);color:var(--teal-deep);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.pane-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pane-h h2{margin:0}
.paper{background:#fff;color:#2b2b2b;border:1px solid #e4d6dd;border-radius:6px;padding:26px 26px 22px;box-shadow:0 14px 34px -22px rgba(0,0,0,.45);font-size:13.5px;position:relative}
.paper h3{margin:0;font-size:22px;letter-spacing:.02em}
.paper .row2{display:flex;justify-content:space-between;gap:12px;margin:3px 0;padding:3px 6px;border-radius:5px;transition:background .15s}
.paper .row2 span:first-child{color:#777}
.paper .row2.hl{background:#fbeab0}
.paper hr{border:0;border-top:1px solid #e6e6e6;margin:12px 0}
.paper table{width:100%;border-collapse:collapse;margin:6px 0}
.paper th,.paper td{text-align:left;padding:5px 6px;border-bottom:1px solid #eee}
.paper td:last-child,.paper th:last-child{text-align:right}
.fld{display:grid;gap:5px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-md);margin-bottom:9px;border-left-width:5px}
.fld.ok{border-left-color:var(--ok)} .fld.warn{border-left-color:var(--warn)} .fld.err{border-left-color:var(--err);background:var(--err-soft)}
.fld .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.fld .lbl em{font-style:normal;font-weight:500;color:var(--muted)}
.fld .msg{font-size:12.5px;display:flex;gap:6px;align-items:center}
.fld.ok .msg{color:var(--ok)} .fld.warn .msg{color:var(--warn)} .fld.err .msg{color:var(--err)}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--err-soft);color:var(--err)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin-bottom:14px}
.banner.block{background:var(--err-soft);color:var(--err)} .banner.info{background:var(--teal-soft);color:var(--teal-deep)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.reason{margin:10px 0 0}
.reason label{font-weight:600;font-size:14px;display:grid;gap:6px}

.voucher{max-width:620px;margin:0 auto;width:100%}
.voucher .paper{padding:34px 34px 28px;overflow:hidden}
.mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mark span{font-size:92px;font-weight:700;color:rgba(184,79,122,.1);transform:rotate(-22deg);letter-spacing:.06em}
.vhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.vhead .word{font-family:var(--script);font-size:30px;color:#308087}
.limit{margin-top:16px;border:1.5px dashed #d99ab4;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7a3550;background:#fff6f9}
.sig{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:12.5px;color:#666}
.sig div{flex:1;border-top:1px solid #bbb;padding-top:5px;text-align:center}

.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--pink-soft);display:grid;gap:14px}
.tl li{position:relative;padding-left:16px}
.tl li::before{content:"";position:absolute;left:-27px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--teal)}
.tl li.bot::before{border-color:var(--pink-deep)} .tl li.sec::before{border-color:var(--err)}
.tl .when{font-size:12.5px;color:var(--muted)} .tl .what{font-weight:600} .tl .det{font-size:14px;color:var(--muted)}
.empty{text-align:center;padding:34px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tblw{overflow-x:auto}

/* login */
.login-hero{background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);color:var(--hero-ink);padding:52px 20px 96px;border-bottom:1px solid var(--line)}
.login-hero h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px);line-height:1.1;max-width:18ch}
.login-hero p{margin:0;max-width:60ch;font-size:17px}
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:grid;gap:10px;align-content:start}
.acct h3{margin:0;font-size:17px}
.acct .role{display:inline-block;background:var(--teal-soft);color:var(--teal-deep);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;justify-self:start}
.acct p{margin:0;color:var(--muted);font-size:14px}

.probe summary{cursor:pointer;font-weight:700;font-size:16px}
.probe .res{display:grid;gap:8px;margin-top:14px}
.probe .res div{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:9px 12px;font-size:14px}
.probe .res .y{background:var(--ok-soft);color:var(--ok)} .probe .res .n{background:var(--err-soft);color:var(--err)}
.probe .tests{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--teal-deep);color:var(--on-teal);padding:11px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:92vw;text-align:center}
.toast.bad{background:var(--err)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.split{grid-template-columns:1fr}.q{grid-template-columns:1fr 1fr;gap:8px 14px}.q>:last-child{grid-column:1/-1}}
@media (max-width:560px){.form{grid-template-columns:1fr}.top-in{padding:10px 14px}.hero,.login-hero{padding-left:14px;padding-right:14px}main{padding:0 14px 48px}.q{grid-template-columns:1fr}.voucher .paper{padding:22px 18px}}
/* ---------- halaman login ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-brand{background:linear-gradient(135deg,var(--hero-from) 0%,var(--hero-to) 100%);color:var(--hero-ink);padding:44px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;border-right:1px solid var(--line)}
.auth-brand h1{margin:0 0 12px;font-size:clamp(28px,3.4vw,42px);line-height:1.15;letter-spacing:-.01em;max-width:16ch}
.auth-brand .lead{margin:0;max-width:46ch;font-size:16px;color:var(--hero-sub)}
.auth-points{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:460px}
.auth-points li{display:flex;gap:12px;align-items:flex-start;background:var(--hero-chip);border:1px solid var(--hero-chip-line);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px}
.auth-points svg{color:var(--teal);margin-top:2px}
.auth-panel{display:grid;place-items:center;padding:32px 24px;background:var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px 28px;box-shadow:0 18px 40px -28px var(--shadow)}
.auth-card h2{margin:0 0 4px;font-size:24px}
.auth-card h2::after{content:none}
.auth-card .sub{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.auth-card label{display:grid;gap:6px;font-weight:600;font-size:14px;margin-bottom:16px}
.auth-card input:not([type=checkbox]){width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px}
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:104px!important}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--teal-deep);font-weight:600;font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px}
.pwtoggle:hover{background:var(--teal-soft)}
.auth-err{display:flex;gap:8px;align-items:flex-start;background:var(--err-soft);color:var(--err);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-bottom:16px}
.auth-card .btn.primary{width:100%;padding:12px 18px;font-size:15.5px}
.auth-foot{margin-top:14px;font-size:13.5px;color:var(--muted);text-align:center}
.demo{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.demo summary{cursor:pointer;font-weight:600;font-size:14px}
.demo .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.demo .m{margin:10px 0 0}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-brand{padding:26px 22px;gap:14px;border-right:0;border-bottom:1px solid var(--line)}.auth-points{display:none}.auth-brand h1{font-size:26px}.auth-panel{align-items:start;padding:22px 16px 40px}}

/* ---------- masuk / daftar ---------- */
.authtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.authtabs button{border:0;background:transparent;padding:9px 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.authtabs button:hover{color:var(--ink)}
.authtabs button[aria-selected="true"]{background:var(--teal);color:var(--on-teal)}
.auth-ok{display:flex;gap:8px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-bottom:16px}
.auth-card select{padding:11px 13px}

/* ---------- pajak voucher ---------- */
.taxrow{display:grid;grid-template-columns:1fr 104px 150px;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:9px}
.taxrow.on{border-color:var(--teal);background:var(--teal-soft)}
.taxchk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.taxchk input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal)}
.taxchk small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin-left:6px}
.tag.add{background:var(--ok-soft);color:var(--ok)}
.tag.withhold{background:var(--warn-soft);color:var(--warn)}
.rate{display:flex;align-items:center;gap:6px}
.rate input{text-align:right;padding:7px 9px}
.amt{text-align:right;font-weight:600;font-size:14px}
.taxadd{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:12px;margin-top:6px;display:grid;gap:8px}
.taxaddrow{display:grid;grid-template-columns:1fr 90px 120px auto;gap:8px}
.taxsum{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sumrow.big{font-size:18px;font-weight:700;border-bottom:0;padding-top:12px;color:var(--teal-deep)}
.approvers{border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:16px 0 0;display:grid;gap:6px}
.approvers legend{font-weight:600;font-size:14px;padding:0 6px}
.approvers label{display:flex;gap:8px;align-items:center;font-size:14.5px}
.approvers input{accent-color:var(--teal)}

/* ---------- voucher pengeluaran (susunan lembar) ---------- */
.voucher.vwide{max-width:780px}
.vpaper{padding:22px!important}
.vpaper .vs{border:1px solid #6e6e6e;background:#fff;color:#222;font-size:13.5px}
.vpaper .vs-title{background:#e0dfe0;text-align:center;padding:7px;border-bottom:1px solid #6e6e6e;font-weight:600}
.vpaper .vs-meta{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid #a8a8a8}
.vpaper .vs-l{text-align:center;padding:6px 8px;border-right:1px solid #a8a8a8;color:#333}
.vpaper .vs-v{padding:6px 12px}
.vpaper .vs-table{width:100%;border-collapse:collapse;margin:0}
.vpaper .vs-table th{background:#e0dfe0;font-weight:500;text-align:center;border:1px solid #6e6e6e;border-left:0;border-right:1px solid #6e6e6e;padding:6px}
.vpaper .vs-table td{border:1px solid #a8a8a8;border-left:0;padding:6px 10px;text-align:left}
.vpaper .vs-table td.c{text-align:center;white-space:nowrap}
.vpaper .vs-table td.r{text-align:right;white-space:nowrap}
.vpaper .vs-table th:last-child,.vpaper .vs-table td:last-child{border-right:0}
.vpaper .vs-table tr.vs-tax td{color:#5b4a55;background:#fbf7f9}
.vpaper .vs-table tr.vs-sub td{font-weight:600;background:#f3f1f2}
.vpaper .vs-total td{background:#e0dfe0;border-top:1px solid #6e6e6e;font-weight:600}
.vpaper .vs-sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px;align-items:start}
.vpaper .vs-approve{display:grid;gap:14px}
.vpaper .vs-approve.a2{grid-template-columns:1fr 1fr}
.vpaper .vs-box{border:1px solid #6e6e6e;height:104px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;color:#333;font-size:13px}
.vpaper .vs-role{margin-top:6px;color:#222;padding-left:6px}
.vpaper .vs-name{font-size:12px;color:#666;padding-left:6px;margin-top:2px}
.vpaper .vs-note{margin:20px 0 0;font-size:11.5px;color:#7a3550}
@media (max-width:640px){
  .taxrow{grid-template-columns:1fr auto}
  .taxrow .amt{grid-column:1/-1;text-align:left}
  .taxaddrow{grid-template-columns:1fr 1fr}
  .taxsum{position:static}
  .vpaper{padding:12px!important}
  .vpaper .vs-meta{grid-template-columns:104px 1fr}
  .vpaper .vs-sign{grid-template-columns:1fr;gap:18px}
  .vpaper .vs-table th,.vpaper .vs-table td{padding:5px 6px;font-size:12.5px}
}

const newUp=()=>({file:'',klien:'',pic:'',jenis:'',tgl:TODAY,cat:'',errs:{}});
const S={session:null,screen:null,sel:null,reason:'',fKlien:'all',fStatus:'all',auditDoc:'all',probe:[],probeOpen:false,up:newUp()};
S.loginErr='';S.loginEmail='';S.authMode='login';S.authNote='';S.regErr='';S.reg={name:'',email:'',role:'support'};S.nu={name:'',email:'',role:'support',pw:''};S.apvRole={};S.nc={name:''};
class E extends Error{constructor(m,deny){super(m);this.deny=!!deny;}}
const me=()=>{if(!S.session)throw new E('Belum masuk.',true);return S.session;};
const userById=id=>USERS.find(u=>u.id===id);

const ev=(k,d,w,x,a,bot)=>EVENTS.push({k,d,t:stamp(),a:a||label(me()),w,x:x||'',bot:bot?1:0});
function inScope(u,doc,scope){
  if(scope==='own')return doc.owner===u.id;
  if(scope==='delegated')return doc.uploader===u.id||doc.status==='Dikembalikan';

}
function can(u,perm,doc){
  if(!(PERMS[u.role]||[]).includes(perm))return {ok:false,why:'Peran '+ROLE[u.role].label+' tidak memiliki izin "'+perm+'".'};
  const scope=perm.split(':')[2];
  if(doc&&SCOPE[scope]){
    if(u.role==='finance'&&doc.uploader===u.id)return {ok:false,why:'Pemisahan tugas: Anda pengunggah dokumen '+doc.no+'.'};

  }

}
function logDeny(u,perm,why){EVENTS.push({k:'security',d:'',t:stamp(),a:label(u),w:'Akses ditolak: '+perm,x:why});}

function guard(perm,doc){const u=me(),r=can(u,perm,doc);if(!r.ok){logDeny(u,perm,r.why);throw new E(r.why,true);}return u;}

function validate(d){
  const f=d.f,c=d.conf,r={};
  FIELDS.forEach(x=>{const k=x[0];r[k]={s:'ok',m:'Sesuai aturan'};

function computeTaxes(dpp,taxes){const lines=taxes.map(t=>Object.assign({},t,{amount:Math.round(dpp*t.rate/100)}));const add=lines.filter(l=>l.kind==='add').reduce((a,l)=>a+l.amount,0);const wh=lines.filter(l=>l.kind==='withhold').reduce((a,l)=>a+l.amount,0);return {dpp,lines,add,withhold:wh,net:dpp+add-wh};}
function normalizeTaxes(raw){
  if(!Array.isArray(raw))throw new E('Data pajak tidak valid.');
  if(raw.length>8)throw new E('Maksimal 8 jenis pajak per voucher.');

  queue(){

  if(d.status==='Disetujui'||d.status==='Ditolak')return '<span class="due m">Selesai</span>';

  const cus=t.custom.map((c,i)=>'<div class="taxrow on"><div class="taxchk"><span><b>'+esc(c.label)+'</b> '+tag(c.kind)+'<small>Pajak lain, tarif '+c.rate+'%</small></span></div><button class="btn sm" data-act="tax-del" data-i="'+i+'">Hapus</button><div class="amt">'+(c.kind==='add'?'+':'-')+' '+rp(Math.round(d.dpp*c.rate/100))+'</div></div>').join('');

function go(s){S.screen=s;S.reason='';render();window.scrollTo({top:0,behavior:'smooth'});}
function resetView(){S.screen=null;S.sel=null;S.reason='';S.fKlien='all';S.fStatus='all';S.auditDoc='all';S.probe=[];S.probeOpen=false;S.up=newUp();}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  const k=a.dataset.act,v=a.dataset.v,id=a.dataset.id;
  if(k==='fill'){const fu=userById(id);document.getElementById('lemail').value=fu.email;document.getElementById('lpw').value=DEMO_PW;S.loginErr='';}
  else if(k==='togglepw'){const pi=document.getElementById('lpw');const on=pi.type==='password';pi.type=on?'text':'password';a.textContent=on?'Sembunyikan':'Tampilkan';a.setAttribute('aria-pressed',String(on));}
  else if(k==='forgot'){const fn=document.getElementById('forgotNote');fn.style.display=fn.style.display==='none'?'block':'none';}
  else if(k==='login'){resetView();S.session=Object.assign({},userById(id),{pw:undefined});render();window.scrollTo(0,0);}
  else if(k==='logout'){S.session=null;S.authMode='login';resetView();render();}
  else if(k==='tax-open'){S.sel=id;S.taxf=null;go('tax');}
  else if(k==='open-voucher'){S.sel=id;go('voucher');}
  else if(k==='tax-del'){S.taxf.custom.splice(+a.dataset.i,1);render();}
  else if(k==='tax-add'){const nc=S.taxf.nc,rate=Number(String(nc.rate).replace(',','.'));
    if(!nc.label.trim())S.taxf.err='Isi nama pajak.';
    else if(!isFinite(rate)||rate<=0||rate>100)S.taxf.err='Tarif harus lebih dari 0 dan paling besar 100%.';
    else{S.taxf.err='';S.taxf.custom.push({code:'LAIN'+(Date.now()%100000),label:nc.label.trim().slice(0,40),rate:rate,kind:nc.kind});S.taxf.nc={label:'',rate:'',kind:'withhold'};}
    render();}
  else if(k==='tax-save'){try{const ret=docById(S.sel).status==='Dikembalikan';const m=api.setTax(S.sel,taxLines(),S.taxf.approvers);toast(m);S.taxf=null;if(ret){S.screen='fixdoc';}else{S.sel=null;S.screen='queue';}render();}catch(err){toast((err.deny?'403 Ditolak. ':'')+err.message,true);render();}}
  else if(k==='go')go(v);
  else if(k==='fs'){S.fStatus=v;render();}
  else if(k==='trace'){S.auditDoc=id;go('audit');}
  else if(k==='fix'){S.sel=id;go('fixdoc');}
  else if(k==='open-review'){S.sel=id;go('review');}
  else if(k==='approve'){try{const m=api.decide(S.sel,'approve');toast(m);S.sel=null;S.screen='queue';render();}catch(err){toast((err.deny?'403 Ditolak. ':'')+err.message,true);render();}}
  else if(k==='reject'||k==='return'){const why=S.reason.trim();attempt(()=>{api.decide(S.sel,k,why);S.reason='';S.sel=null;S.screen='queue';},k==='reject'?'Dokumen ditolak.':'Dokumen dikembalikan ke Intake Support untuk diperbaiki.');}
  else if(k==='download')attempt(()=>api.download(S.sel),'Voucher diunduh (simulasi).');
  else if(k==='add-user')attempt(()=>{api.createUser(S.nu);S.nu={name:'',email:'',role:'support',pw:''};},'Akun pegawai dibuat. Sampaikan kata sandi awal ke pegawai.');
  else if(k==='authmode'){S.authMode=v;S.loginErr='';S.regErr='';S.authNote='';render();}
  else if(k==='resubmit')attempt(()=>{api.resubmit(S.sel,S.reason.trim());S.reason='';S.sel=null;S.screen='queue';},'Dokumen dikirim ulang ke Finance Reviewer.');
  else if(k==='add-client')attempt(()=>{api.addClient(S.nc);S.nc={name:''};},'Klien ditambahkan.');
  else if(k==='acc-ok')attempt(()=>api.accessDecide(id,true,S.apvRole[id]),'Permintaan disetujui.');
  else if(k==='acc-no')attempt(()=>api.accessDecide(id,false),'Permintaan ditolak.');
  else if(k==='reset-up'){S.up=newUp();render();}
  else if(k==='submit-up'){
    const f=S.up,er={};
    if(!f.file)er.file='Pilih file PDF invoice terlebih dulu.';
    if(!f.klien)er.klien='Pilih klien.';if(!f.jenis)er.jenis='Pilih jenis permintaan.';if(me().role==='support'&&!f.pic)er.pic='Pilih PIC Klien yang menerima order ini.';
    f.errs=er;
    if(Object.keys(er).length){render();toast('Lengkapi data yang ditandai merah.',true);return;}
    attempt(()=>{const nd=api.createDoc(f);S.up=newUp();S.sel=nd.id;S.taxf=null;S.screen='tax';},'Dokumen terbaca. Lanjut atur pajak untuk voucher.');
  }
  else if(k==='probe'){
    const t=TESTS[+a.dataset.i];const u=me();const perm=t[1](u);const r=api.probe(perm,t[2]);
    S.probe.unshift({ok:r.ok,t:t[0],why:r.why});S.probe=S.probe.slice(0,6);S.probeOpen=true;render();
  }
});
document.addEventListener('change',e=>{
  const el=e.target,b=el.dataset.bind;if(!b)return;
  if(b==='fKlien'){S.fKlien=el.value;render();}
  else if(b==='tax.on'){S.taxf.sel[el.dataset.code].on=el.checked;render();}
  else if(b==='tax.rate'){S.taxf.sel[el.dataset.code].rate=el.value;render();}
  else if(b==='tax.apv'){S.taxf.approvers=+el.value;render();}
  else if(b==='tax.nl'){S.taxf.nc.label=el.value;}
  else if(b==='tax.nr'){S.taxf.nc.rate=el.value;}
  else if(b==='tax.nk'){S.taxf.nc.kind=el.value;}
  else if(b==='sel'){S.sel=el.value;render();}
  else if(b==='auditDoc'){S.auditDoc=el.value;render();}
  else if(b==='assign')attempt(()=>api.reassign(el.dataset.id,el.value),'Tugas dialihkan.');
  else if(b==='apvrole'){S.apvRole[el.dataset.id]=el.value;}
  else if(b==='setrole')attempt(()=>api.setRole(el.dataset.id,el.value),'Peran diperbarui.');
  else if(b==='file')setFile(el.files&&el.files[0]);
  else if(b.startsWith('up.')){S.up[b.slice(3)]=el.value;delete S.up.errs[b.slice(3)];render();}
  else if(b==='field'){
    const k=el.dataset.k,x=FIELDS.find(q=>q[0]===k);let nv=el.value.trim();
    if(x[2]==='num'){const dg=nv.replace(/\D/g,'');nv=dg===''?'':Number(dg);}
    attempt(()=>api.correct(S.sel,k,nv),'Koreksi '+x[1]+' tersimpan.');
  }
});
document.addEventListener('input',e=>{const b=e.target.dataset.bind;if(b==='reason')S.reason=e.target.value;else if(b&&b.startsWith('nc.'))S.nc[b.slice(3)]=e.target.value;else if(b&&b.startsWith('nu.'))S.nu[b.slice(3)]=e.target.value;});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('probe'))S.probeOpen=e.target.open;},true);
document.addEventListener('focusin',e=>{
  document.querySelectorAll('.paper .row2.hl').forEach(n=>n.classList.remove('hl'));
  const t=e.target;if(t.dataset&&t.dataset.bind==='field'){const n=document.querySelector('.paper [data-src="'+t.dataset.k+'"]');if(n)n.classList.add('hl');}
});
function setFile(f){
  if(!f)return;
  if(!/pdf$/i.test(f.name)){S.up.errs.file='File harus berformat PDF.';render();return;}
  S.up.file=f.name;delete S.up.errs.file;render();toast('File '+f.name+' siap dikirim.');
}
document.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();setFile(e.dataTransfer.files[0]);}});

document.addEventListener('submit',e=>{
  if(e.target.id==='regForm'){
    e.preventDefault();const g=i=>document.getElementById(i).value;
    S.reg={name:g('rname'),email:g('remail'),role:g('rrole')};
    try{const em=api.register({name:g('rname'),email:g('remail'),role:g('rrole'),pw:g('rpw'),pw2:g('rpw2')});
      S.regErr='';S.authMode='login';S.loginEmail=em;S.authNote='Pendaftaran terkirim. Akun aktif setelah disetujui System Admin. Setelah itu masuk dengan email dan kata sandi yang Anda buat.';S.reg={name:'',email:'',role:'support'};render();}
    catch(err){S.regErr=err.message;render();}
    return;}
  if(e.target.id!=='loginForm')return;
  e.preventDefault();
  const em=document.getElementById('lemail').value.trim().toLowerCase(),pw=document.getElementById('lpw').value;
  S.loginEmail=em;
  const t=LOGIN_TRIES[em]||{n:0,until:0};
  const fail=m=>{S.loginErr=m;render();const f=document.getElementById('lpw');if(f)f.focus();};
  if(!em||!pw)return fail('Isi email dan kata sandi.');
  if(t.until>Date.now())return fail('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((t.until-Date.now())/1000)+' detik.');
  const u=USERS.find(x=>x.email===em);
  if(!u||pw!==u.pw){t.n++;if(t.n>=5){t.n=0;t.until=Date.now()+60000;}LOGIN_TRIES[em]=t;return fail('Email atau kata sandi salah.');}
  if(u.status==='Menunggu')return fail('Akun Anda masih menunggu persetujuan System Admin.');
  if(u.status==='Ditolak')return fail('Pendaftaran akun ini ditolak. Hubungi System Admin.');
  delete LOGIN_TRIES[em];S.loginErr='';S.loginEmail='';S.authNote='';resetView();S.session=Object.assign({},u,{pw:undefined});render();window.scrollTo(0,0);
});

render();
</script>
</body>
</html>
